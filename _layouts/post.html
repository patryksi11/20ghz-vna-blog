---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt_intro %}<p class="post-lead">{{ page.excerpt_intro }}</p>{% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <footer class="post-footer">
    <p><a href="{{ '/blog' | relative_url }}">← Back to all updates</a></p>
    <p class="post-footer-note">Questions or ideas? The project thread lives on Reddit — the site will be kept in sync as the build progresses.</p>
  </footer>
</article>
